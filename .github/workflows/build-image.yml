name: Build Image

# Runs the unit tests, builds the image and smoke-tests it.
# On main: pushes the image to ghcr.io and creates a release automatically.
# Dependabot PRs (patch/minor) are merged automatically once CI is green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: corepack enable

      - run: yarn install --immutable

      - name: Unit tests
        run: yarn test

      - name: Production build
        run: yarn build

  security:
    uses: ./.github/workflows/security.yml

  # The Playwright run is expensive, so on main it runs as its own workflow
  # outside the publishing path. On pull requests it gates the Dependabot merge.
  e2e:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e.yml

  image:
    needs: [check, security]
    runs-on: ubuntu-latest
    # Only this job needs write access to ghcr.io
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Determine image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/projekt-planer" >> "$GITHUB_ENV"

      - name: Determine next version
        id: version
        if: env.PUBLISH == 'true'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "No release yet, starting with v1.0.0"
            echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subjects=$(git log --no-merges --format=%s "$last..HEAD")
          # CI, docs, test and maintenance changes alone do not create a release,
          # dependency updates (chore(deps)) do.
          relevant=$(printf '%s\n' "$subjects" | grep -v '^$' \
            | grep -Ev '^(ci|docs|test|style|chore)(\([^)]*\))?!?:' || true)
          deps=$(printf '%s\n' "$subjects" | grep -E '^chore\(deps\)' || true)
          if [ -z "$relevant$deps" ]; then
            echo "No release-relevant changes since $last"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "${last#v}"
          if git log --no-merges --format=%B "$last..HEAD" | grep -Eq '^BREAKING CHANGE' \
             || printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            major=$((major + 1)); minor=0; patch=0
          elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "Next version: v$major.$minor.$patch (previous $last)"
          echo "version=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      # The image reports the release version (info dialog), so package.json
      # gets it before the build; the release job commits the same change.
      - name: Set package.json version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="${VERSION#v}"

      # No build-args for Supabase: docker/entrypoint.sh writes env-config.js at
      # runtime from the container environment.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context:   .
          file:      Dockerfile
          platforms: linux/amd64
          load:      true
          tags:      projekt-planer:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run -d --name smoke -p 8080:80 \
            -e SUPABASE_PROJECT_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=ci \
            projekt-planer:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -qi '<html' \
            || { docker logs smoke; exit 1; }
          curl -sf http://localhost:8080/env-config.js | grep -q 'example.supabase.co' \
            || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Determine tags
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "TAGS<<EOF"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "${IMAGE}:latest"
            if [ -n "$VERSION" ]; then echo "${IMAGE}:${VERSION#v}"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context:   .
          file:      Dockerfile
          platforms: linux/amd64
          push:      true
          tags:      ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha

  release:
    needs: image
    if: needs.image.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # chore(release) commits do not count as release-relevant, and pushes
      # with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit version to package.json
        id: bump
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          npm pkg set version="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.version }}
          TARGET: ${{ steps.bump.outputs.sha }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "$VERSION" \
            --generate-notes

  automerge:
    needs: [image, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
          # A merge with GITHUB_TOKEN does not trigger push workflows,
          # so start the main build (image + release) explicitly.
          gh workflow run build-image.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref main
