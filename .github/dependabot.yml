# Dependabot keeps the npm packages (yarn.lock), the Docker base images, the
# self-hosted Supabase images and the GitHub Actions up to date. Patch and
# minor updates are merged automatically once CI is green (see
# .github/workflows/build-image.yml, job "automerge"), except the Supabase
# images, which CI does not test.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"

  # Supabase images in docker-compose.self-hosted.yml. Updates are grouped so
  # the services move together; check docker/supabase/README.md before merging.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      supabase:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
