# Projekt-Planer together with a self-hosted Supabase.
#
# This file extends the official Supabase Docker setup
# (https://github.com/supabase/supabase/tree/master/docker) instead of copying
# it, so Supabase keeps its own update path. Run it from the supabase/docker
# folder, next to the official docker-compose.yml and .env:
#
#   docker compose -f docker-compose.yml \
#     -f /path/to/projekt-planer/docker/compose.self-hosted.yml up -d
#
# Requires Docker Compose 2.24.4 or later (!override). See docs/deployment.md.
services:
  projekt-planer:
    image: ghcr.io/jeansy91/projekt-planer:${PROJEKT_PLANER_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PROJEKT_PLANER_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPABASE_PROJECT_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      # Applies the migrations from supabase/migrations/ on every start
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Copies the Edge Functions next to the official ones
      FUNCTIONS_DIR: /functions
    volumes:
      - ./volumes/functions:/functions:z

  functions:
    environment:
      SMTP_HOSTNAME: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_ADMIN_EMAIL}
      PROJEKT_PLANER_URL: ${SITE_URL}

  # Auth emails use the Projekt-Planer templates served by the app container
  auth:
    environment:
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://projekt-planer/email-templates/confirm-signup.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://projekt-planer/email-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://projekt-planer/email-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://projekt-planer/email-templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://projekt-planer/email-templates/email-change.html
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"

  # Projekt-Planer does not transform images and connects to Postgres
  # directly, so imgproxy and the Supavisor pooler stay off.
  # Start them anyway with --profile imgproxy / --profile pooler.
  storage:
    depends_on: !override
      db:
        condition: service_healthy
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"

  imgproxy:
    profiles: [imgproxy]

  supavisor:
    profiles: [pooler]
